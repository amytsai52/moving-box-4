<!DOCTYPE html>

<html>

<head>

  <title>終極粒子版</title>

  <style>

    body {

      margin: 0;

      overflow: hidden;

      background: radial-gradient(circle, #020024, #090979, #000);

      font-family: Arial, sans-serif;

      color: white;

    }

    h1 {

      position: absolute;

      top: 25px;

      width: 100%;

      text-align: center;

      z-index: 2;

      font-size: 36px;

      text-shadow: 0 0 20px cyan, 0 0 40px purple;

    }

    .box {

      position: absolute;

      top: 50%;

      left: 50%;

      width: 130px;

      height: 130px;

      border-radius: 30px;

      background: linear-gradient(45deg, cyan, lime, yellow, hotpink);

      box-shadow: 0 0 50px cyan;

      transform: translate(-50%, -50%);

      animation: spin 4s linear infinite, glow 1.5s infinite alternate;

      z-index: 2;

    }

    @keyframes spin {

      from { transform: translate(-50%, -50%) rotate(0deg); }

      to { transform: translate(-50%, -50%) rotate(360deg); }

    }

    @keyframes glow {

      from { box-shadow: 0 0 30px cyan; }

      to { box-shadow: 0 0 80px yellow, 0 0 120px hotpink; }

    }

    canvas {

      position: fixed;

      top: 0;

      left: 0;

    }

  </style>

</head>

<body>

  <h1>🌌 終極粒子宇宙 🌌</h1>

  <div class="box"></div>

  <canvas id="canvas"></canvas>

  <script>

    const canvas = document.getElementById("canvas");

    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

    const mouse = { x: null, y: null };

    let particles = [];

    window.addEventListener("mousemove", e => {

      mouse.x = e.x;

      mouse.y = e.y;

    });

    window.addEventListener("touchmove", e => {

      mouse.x = e.touches[0].clientX;

      mouse.y = e.touches[0].clientY;

    });

    window.addEventListener("click", () => {

      particles.forEach(p => {

        p.dx *= 6;

        p.dy *= 6;

      });

    });

    function createParticles() {

      for (let i = 0; i < 120; i++) {

        particles.push({

          x: Math.random() * canvas.width,

          y: Math.random() * canvas.height,

          r: Math.random() * 3 + 1,

          dx: (Math.random() - 0.5) * 1.5,

          dy: (Math.random() - 0.5) * 1.5,

          color: `hsl(${Math.random() * 360}, 100%, 60%)`

        });

      }

    }

    function drawLines() {

      for (let i = 0; i < particles.length; i++) {

        for (let j = i + 1; j < particles.length; j++) {

          const dx = particles[i].x - particles[j].x;

          const dy = particles[i].y - particles[j].y;

          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 110) {

            ctx.strokeStyle = "rgba(255,255,255,0.2)";

            ctx.lineWidth = 1;

            ctx.beginPath();

            ctx.moveTo(particles[i].x, particles[i].y);

            ctx.lineTo(particles[j].x, particles[j].y);

            ctx.stroke();

          }

        }

      }

    }

    function animate() {

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {

        ctx.fillStyle = p.color;

        ctx.beginPath();

        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);

        ctx.fill();

        if (mouse.x && mouse.y) {

          const dx = mouse.x - p.x;

          const dy = mouse.y - p.y;

          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 120) {

            p.x -= dx / 25;

            p.y -= dy / 25;

          }

        }

        p.x += p.dx;

        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;

        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

      });

      drawLines();

      requestAnimationFrame(animate);

    }

    createParticles();

    animate();

  </script>

</body>

</html>
