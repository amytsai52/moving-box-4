<!DOCTYPE html>

<html>

<head>

  <title>超炫動畫版</title>

  <style>

    body {

      margin: 0;

      height: 100vh;

      overflow: hidden;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-direction: column;

      color: white;

      font-family: Arial, sans-serif;

      background: linear-gradient(120deg, #000428, #004e92, #7f00ff, #e100ff);

      background-size: 400% 400%;

      animation: bgMove 8s infinite alternate;

    }

    @keyframes bgMove {

      0% { background-position: left top; }

      100% { background-position: right bottom; }

    }

    h1 {

      font-size: 36px;

      text-shadow: 0 0 20px white;

      animation: glow 1.5s infinite alternate;

    }

    @keyframes glow {

      from { text-shadow: 0 0 10px white; }

      to { text-shadow: 0 0 30px cyan, 0 0 60px purple; }

    }

    .box {

      width: 120px;

      height: 120px;

      margin-top: 40px;

      border-radius: 25px;

      background: linear-gradient(45deg, cyan, lime, yellow);

      box-shadow: 0 0 30px cyan;

      animation: float 2s infinite alternate, spin 4s linear infinite;

      transition: 0.3s;

    }

    .box:active {

      transform: scale(1.5) rotate(180deg);

      box-shadow: 0 0 60px yellow;

    }

    @keyframes float {

      from { translate: 0 0; }

      to { translate: 0 120px; }

    }

    @keyframes spin {

      from { rotate: 0deg; }

      to { rotate: 360deg; }

    }

    .circle {

      position: absolute;

      width: 20px;

      height: 20px;

      border-radius: 50%;

      background: white;

      opacity: 0.6;

      animation: rise 6s infinite linear;

    }

    @keyframes rise {

      from {

        transform: translateY(100vh) scale(0.5);

        opacity: 0;

      }

      50% {

        opacity: 0.8;

      }

      to {

        transform: translateY(-20vh) scale(1.5);

        opacity: 0;

      }

    }

  </style>

</head>

<body>

  <h1>✨ 超炫動畫網站 ✨</h1>

  <div class="box" onclick="changeBox()"></div>

  <div class="circle" style="left:10%; animation-delay:0s;"></div>

  <div class="circle" style="left:30%; animation-delay:1s;"></div>

  <div class="circle" style="left:50%; animation-delay:2s;"></div>

  <div class="circle" style="left:70%; animation-delay:3s;"></div>

  <div class="circle" style="left:90%; animation-delay:4s;"></div>

  <script>

    function changeBox() {

      const box = document.querySelector('.box');

      box.style.background = "linear-gradient(45deg, red, orange, yellow)";

      box.style.boxShadow = "0 0 80px yellow";

    }

  </script>

</body>

</html>
